name: ShellCheck

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: a new shellcheck release can add checks and turn the
      # build red without anything in this repo changing. Bump this deliberately.
      - name: Run shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck:v0.11.0 rakpios-cli lib/rakpios-cli-*
